<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Redundancy Removal System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">

            <div class="logo">
                🔍
            </div>

            <h1>Data Redundancy Removal</h1>

            <p class="subtitle">
                Detect duplicate and invalid data instantly
            </p>

        </div>


        <!-- Main Card -->
        <div class="card">

            <div class="input-header">

                <label for="dataInput">
                    Enter Data
                </label>

                <span class="helper">
                    Data validation system
                </span>

            </div>


            <!-- Data Input -->
            <textarea
                id="dataInput"
                placeholder="Enter your data here..."></textarea>


            <!-- Check Button -->
            <button onclick="checkData()">
                🔎 Check Data
            </button>


            <!-- Result -->
            <div id="result" class="result">
                Result will appear here
            </div>

        </div>


        <!-- Footer -->
        <div class="footer">
            Data Redundancy Removal System • CodeAlpha Internship Project
        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
